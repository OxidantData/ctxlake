name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CTXLAKE_TEST_S3_ENDPOINT: http://localhost:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      # MinIO is a first-class backend, and it is the one that lacks
      # `If-None-Match: *`, so the CAS suite has to pass here and not only on S3.
      #
      # Two non-obvious choices, both learned the hard way:
      #
      # - The image comes from quay.io, not Docker Hub. `minio/minio` on Docker Hub
      #   now returns 401 with zero listed tags, and `bitnami/minio:latest` 404s.
      #   quay.io/minio/minio is still public.
      # - It is started with `docker run` rather than as a service container,
      #   because the image needs `server /data` as its command and GitHub service
      #   containers cannot override a command.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:latest server /data
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              echo "minio ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::MinIO did not become ready"; docker logs minio; exit 1

      # Without a bucket the CAS suite probes, finds it unwritable, and SKIPS while
      # still reporting "ok" — so the one test that proves this design would silently
      # stop covering the backend it exists for.
      - name: Create the test bucket
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          aws --endpoint-url http://localhost:9000 s3 mb s3://ctxlake-test
          aws --endpoint-url http://localhost:9000 s3 ls

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # The MinIO suite skips rather than fails when its bucket is unreachable, which is
      # right for a laptop and wrong for CI: a green tick would mean nothing. Run it with
      # output captured and treat the skip message as a failure, so MinIO coverage cannot
      # quietly lapse.
      - name: Assert the MinIO CAS suite actually ran
        env:
          CTXLAKE_TEST_S3_BUCKET: ctxlake-test
        run: |
          set -o pipefail
          # The target is `cas`, not `cas_torture`: the torture suite proved CAS by
          # acquiring and releasing leases in a loop, and leases are gone. `cargo test
          # --test <name>` errors on an unknown target rather than running nothing, which
          # is how this rename got caught — keep it that way, never `--test '*'`.
          cargo test -p ctxlake-store --test cas -- --nocapture 2>&1 | tee /tmp/cas.log
          if grep -q "skipping MinIO suite" /tmp/cas.log; then
            echo "::error::The MinIO CAS suite skipped. MinIO is the backend without \
          put-if-absent, so skipping it defeats the purpose of running it."
            exit 1
          fi
          # The grep above only proves the suite did not *say* it skipped. Name the
          # test that has to have passed: renaming or deleting `cas_torture_minio`
          # would satisfy every check above this line while testing MinIO not at all.
          # No `$` anchor: --nocapture interleaves stderr, so another test's output can
          # land on the tail of this line. "... ok" is still unambiguous — a failure
          # reads "... FAILED".
          if ! grep -qE "^test cas_torture_minio \.\.\. ok" /tmp/cas.log; then
            echo "::error::cas_torture_minio did not run and pass. MinIO is the only \
          backend without put-if-absent; losing it loses the coverage this job exists for."
            cat /tmp/cas.log
            exit 1
          fi
          echo "MinIO CAS suite ran against a real endpoint."

  hook-deps:
    # Invariant 2 (AGENTS.md): ctxlake-hook fires on every tool call and must stay
    # under 5ms. It may not link an async runtime, an HTTP stack, or an object store.
    # This job is the enforcement; without it the boundary erodes one PR at a time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"
      - name: Assert the hook's dependency tree stays small
        run: |
          tree=$(cargo tree -p ctxlake-hook --edges normal --prefix none | awk '{print $1}' | sort -u)
          echo "$tree"
          banned='^(tokio|object_store|reqwest|hyper|aws-sdk-.*|aws-config|arrow|parquet|rusqlite|axum|tonic)$'
          if echo "$tree" | grep -qE "$banned"; then
            echo "::error::ctxlake-hook linked a banned dependency (see AGENTS.md invariant 2)"
            echo "$tree" | grep -E "$banned"
            exit 1
          fi
