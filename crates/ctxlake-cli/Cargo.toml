[package]
name = "ctxlake-cli"
description = "The ctxlake binary: init, doctor, install, import, status, claim, sync, mcp, maint."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "ctxlake"
path = "src/main.rs"

[dependencies]
ctxlake-core = { path = "../ctxlake-core" }
ctxlake-store = { path = "../ctxlake-store" }
# `ctxlake import` appends to the exact same spool `ctxlake-hook` writes and
# `ctxlake sync` drains (`import/mod.rs`'s module doc). Reusing that crate's
# `spool::append_event_at` and its `adapters::common` redaction helpers — rather
# than growing a second spool writer and a second scrubber here — is AGENTS.md
# invariant 7 taken literally. This is a path dependency on a workspace member,
# not a new third-party crate, and it does not touch ctxlake-hook's own dependency
# tree, which is what invariant 2 and CI's `hook-deps` job govern. It was already
# a dev-dependency of this crate for the briefing round-trip test.
ctxlake-hook = { path = "../ctxlake-hook" }
ctxlake-maint = { path = "../ctxlake-maint" }
ctxlake-mcp = { path = "../ctxlake-mcp" }
# The daemon library behind `ctxlake sync` (upload/cache/presence loops) — see
# `sync_cmd.rs`'s module doc. Not a dependency before this wave: nothing here
# called `ctxlake sync` until now.
ctxlake-sync = { path = "../ctxlake-sync" }
clap.workspace = true
# Adds the "signal" feature on top of the workspace default so `ctxlake sync
# --foreground` can catch SIGTERM/SIGINT for graceful shutdown
# (`tokio::signal::unix`, `tokio::signal::ctrl_c`). This is an additive feature on
# an existing workspace dependency, merged via Cargo's normal feature unification —
# not a new crate (AGENTS.md: "don't add a dependency without saying why" is about
# new crates; this changes no dependency tree).
tokio = { workspace = true, features = ["signal"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
glob.workspace = true
time.workspace = true
object_store.workspace = true
url.workspace = true
futures.workspace = true
# `ctxlake import --runtime hermes` reads Hermes's own `~/.hermes/state.db`. Not a
# new workspace dependency (ctxlake-maint and ctxlake-mcp already carry it, so it
# is already in this binary's tree via them); named here because this crate now
# uses it directly, and `bundled` keeps the read-only/URI open flags this importer
# depends on independent of whatever libsqlite3 the host happens to ship.
rusqlite.workspace = true
# `object_store::path::Path` percent-encodes a dynamic segment on write
# (`PathPart`'s `join`/`child`) but exposes no public way to decode one back —
# `Path::filename()`/`Path::parts()` both return the raw, still-encoded segment.
# `claims.rs`'s quarantine list needs the real, decoded `agent_id` back out of
# `claims/quarantine/<agent_id>.json` to compare against `observed_by`, so this
# crate does the decode itself with the same crate `object_store` uses
# internally (already resolved in Cargo.lock at 2.3.2 via that dependency —
# this pins the same version rather than letting it drift independently).
percent-encoding = "2.3.2"
# Scoped to this crate only (never linked into ctxlake-hook, AGENTS.md invariant 2
# governs that crate's tree, not this one's): the installer must merge into a real
# `~/.hermes/config.yaml` without clobbering key order or an operator's other entries.
# `serde_json::Value` (a BTreeMap under the hood) would re-sort every key on write, and
# turning on its `preserve_order` feature here would leak into the whole workspace's
# build via Cargo's feature unification for any command that builds more than just this
# crate — exactly the risk not worth taking for invariant 2's sake. `json` keeps object
# insertion order by construction, with no shared feature flag to reason about.
json = "0.12"
# Hermes' config is YAML, and nothing in the workspace parses YAML yet. `serde_yaml`'s
# `Mapping` preserves insertion order internally, so merging into an existing
# `config.yaml` doesn't reshuffle keys the operator never touched.
serde_yaml = "0.9"

[dev-dependencies]
tempfile.workspace = true
# ctxlake-hook is a normal dependency now (see above); the briefing round-trip test
# that first pulled it in as a dev-dependency still needs both halves in one binary,
# or neither notices the other changing shape.
# Test-only: the concurrent-first-claim regression test wraps a real `ObjectStore`
# to force the exact interleaving `ensure_provisioned` (claim.rs) must survive.
# `object_store::ObjectStore` is itself defined with `#[async_trait]`
# (ctxlake-store/Cargo.toml carries the identical dependency for the same reason —
# its own `PutModeSpy` test double), so implementing it requires the same macro.
async-trait = "0.1"
# `briefing.rs`'s tests build fixture `snapshot.bin` files through
# `ctxlake_mcp::snapshot::test_support` rather than hand-rolling a second copy of
# its schema — see that module's doc. Cargo only applies this feature to test
# builds of this crate (dev-dependencies are excluded from a release build), so
# it never reaches the real `ctxlake` binary.
ctxlake-mcp = { path = "../ctxlake-mcp", features = ["test-support"] }
