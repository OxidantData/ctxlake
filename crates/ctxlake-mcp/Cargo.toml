[package]
name = "ctxlake-mcp"
description = "stdio JSON-RPC MCP server exposing fleet and memory tools."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The real binary: `ctxlake-mcp` on stdin/stdout, exactly what `run_stdio` drives.
# It exists so the crate's stdout-purity guarantee can be tested against a genuine
# child process — a `serve()` call against an in-memory buffer never observes a
# stray write to the process's *real* stdout, which is the one this guarantee is
# actually about. `ctxlake-cli`'s own `mcp` subcommand (Wave 2, not yet wired) will
# eventually just exec this same `run_stdio()`.
[[bin]]
name = "ctxlake-mcp"
path = "src/bin/ctxlake-mcp.rs"

[dependencies]
# ctxlake-core only, matching ctxlake-hook's own discipline (AGENTS.md invariant
# 1/2, extended here on purpose): this process never touches the network, in
# either direction (docs/architecture.md's component table), so it links neither
# object_store nor tokio nor anything that could put the store on this path by
# accident. Everything it does — read the local cache, append to the local spool
# — is synchronous, ordinary filesystem I/O; an async runtime would buy nothing.
ctxlake-core = { path = "../ctxlake-core" }
serde.workspace = true
serde_json.workspace = true
# `snapshot.rs` opens `<cache_root>/<fleet_id>/snapshot.bin` — a plain local file
# ctxlake-sync's cache leg already mirrors byte-for-byte from the object store, so
# reading it is ordinary synchronous file I/O, not a new way to reach the network.
# `bundled` compiles sqlite in-process (no system libsqlite version skew, no
# dynamic-linking surprise) and pulls in neither object_store nor tokio, so
# AGENTS.md invariant 1's boundary for this crate is unchanged.
rusqlite = { workspace = true, features = ["bundled"] }
# `memory_propose`'s spooled record now mirrors `ctxlake-maint::claims`'s real
# `ClaimEvent::Proposed` wire shape (see `wire.rs`), which carries a real
# `observed_at` timestamp — this crate has no clock of its own otherwise. Adds no
# network or async runtime dependency; already a pinned workspace version used
# by `ctxlake-store`/`ctxlake-cli`.
time.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
# Exposes `snapshot::test_support` (a fixture-`snapshot.bin` builder matching
# `ctxlake-maint::snapshot`'s real schema) to other crates' tests — see that
# module's doc. Never enabled outside `[dev-dependencies]`, so it never reaches a
# release binary.
test-support = []
