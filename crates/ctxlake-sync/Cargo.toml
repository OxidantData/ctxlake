[package]
name = "ctxlake-sync"
description = "The daemon: hook spool -> object store (bronze) and object store -> local cache (roster, snapshot). The only component that talks to the store on a schedule (AGENTS.md invariant 1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ctxlake-core = { path = "../ctxlake-core" }
ctxlake-store = { path = "../ctxlake-store" }
# Direct access to `ObjectStore`/`PutPayload`/`GetOptions` etc. — ctxlake-store wraps
# these for its own coordination primitives (lease/intent/roster) but does not
# re-export the crate itself, and this daemon also reads/writes `sessions/` and
# `snapshot/` directly, which ctxlake-store has no wrapper for.
object_store.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
bytes.workspace = true
futures.workspace = true
arrow.workspace = true
parquet.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
